<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="108"/></clipPath>
    <pattern id="argyle" width="120" height="160" patternUnits="userSpaceOnUse">
      <rect width="120" height="160" fill="#020F16"/>
      <polygon points="60,0 120,80 60,160 0,80" fill="#09354D"/>
      <polygon points="0,0 60,80 0,160" fill="#05202F"/>
      <polygon points="120,0 60,80 120,160" fill="#05202F"/>
      <g stroke="#1B9CE3" stroke-width="2" opacity="0.30" stroke-dasharray="6 7">
        <path d="M60 -80 L200 80 M60 -80 L-80 80 M60 80 L200 240 M60 80 L-80 240 M60 240 L200 400 M60 240 L-80 400"/>
      </g>
    </pattern>
  </defs>
  <g clip-path="url(#tile)"><rect x="16" y="16" width="480" height="480" fill="url(#argyle)"/></g>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#2BD3D3" stroke-width="6"/>

  <!-- Z-Wave JS UI: hex Z-Wave mark + JS UI wordmark, legible on dark -->
  <polygon points="336,186 296,256 216,256 176,186 216,116 296,116"
           fill="#1B9CE3" stroke="#0B2E44" stroke-width="6" stroke-linejoin="round"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M223 148 H289"/>
    <path d="M289 148 Q256 186 223 224"/>
    <path d="M223 224 H289"/>
  </g>
  <text x="256" y="338" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="74" fill="#FFFFFF" letter-spacing="3">JS UI</text>
</svg>
